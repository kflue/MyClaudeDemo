<button
  type="button"
  class="sidebar-toggle"
  aria-controls="chat-sidebar"
  [attr.aria-expanded]="sidebarOpen()"
  (click)="toggleSidebar.emit()"
>
  <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
    <path
      d="M4 6h16M4 12h16M4 18h16"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
    />
  </svg>
  <span class="visually-hidden">{{ sidebarOpen() ? 'Close sidebar' : 'Open sidebar' }}</span>
</button>

<label class="visually-hidden" for="model-select">Model</label>
<select
  id="model-select"
  class="model-select"
  [value]="store.selectedModel()"
  [disabled]="store.isResponding()"
  (change)="selectModel($event)"
>
  @for (model of store.models; track model) {
    <option [value]="model">{{ model }}</option>
  }
</select>
